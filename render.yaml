services:
  - type: web
    name: securedoc
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECUREDOC_SECRET_KEY
        generateValue: true
      - key: SECUREDOC_HTTPS_ONLY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: securedoc-db
          property: connectionString

databases:
  - name: securedoc-db
    plan: free
    databaseName: securedoc
    user: securedoc

