<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureDoc | Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background: #F5F0E8;
            min-height: 100vh;
        }

        .app-header {
            background: #24142F;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-header h1 {
            font-family: 'Playfair Display', serif;
        }

        .app-header button, .action-btn {
            background: #C8754D;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .app-content {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .stats {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px #00000010;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px #00000010;
        }

        .panel h2 {
            margin-bottom: 20px;
            color: #24142F;
        }

        .upload-form {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        input[type="file"] {
            max-width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .document-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
        }

        .document-info {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .document-info p {
            color: #817780;
            font-size: 13px;
            margin-top: 5px;
        }

        .document-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-message {
            margin-top: 15px;
            color: #A95435;
        }

        .empty-message {
            color: #817780;
            padding: 15px 0;
        }

        @media(max-width: 600px) {
            .app-content {
                margin: 20px auto;
            }

            .panel {
                padding: 18px;
            }
        }

        .editor-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #00000099;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .editor-modal.open {
            display: flex;
        }

        .editor-box {
            background: white;
            width: 100%;
            max-width: 850px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 30px #00000030;
        }

        .editor-box h2 {
            color: #24142F;
            margin-bottom: 15px;
            overflow-wrap: anywhere;
        }

        #editor-content {
            width: 100%;
            min-height: 300px;
            resize: vertical;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font: 14px/1.5 monospace;
            box-sizing: border-box;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .editor-actions button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        #editor-save {
            background: #C8754D;
            color: white;
        }

        #editor-cancel {
            background: #eee;
            color: #24142F;
        }

        #editor-message {
            margin-top: 10px;
            color: #A95435;
        }
    </style>
<script src="/static/js/csrf.js"></script></head>

<body>

<header class="app-header">
    <h1>SecureDoc</h1>
    <button id="logout-button" type="button">Log Out</button>
</header>

<main class="app-content">

    <section class="welcome">
        <h2 id="welcome-message">Welcome!</h2>
        <p>Your secure document management workspace.</p>
    </section>

    <section class="stats">
        <h2>My Documents</h2>
        <h1 id="document-count">0</h1>
        <p>Total uploaded documents</p>
    </section>

    <section class="stats">
        <h2>Received Files</h2>
        <h1 id="shared-count">0</h1>
        <p>Documents shared with you</p>
    </section>

    <section class="panel" id="upload-panel">
        <h2>Upload Documents</h2>

        <form id="upload-form" class="upload-form">
            <select id="document-category" required>
                <option value="General">General</option>
                <option value="Finance">Finance</option>
                <option value="HR">HR</option>
                <option value="Legal">Legal</option>
                <option value="Contracts">Contracts</option>
                <option value="Reports">Reports</option>
                <option value="Other">Other</option>
            </select>

            <input
                type="file"
                id="document-file"
                accept=".pdf,.txt,.png,.jpg,.jpeg,.docx,.ppt,.pptx"
                required
            >

            <button class="action-btn" type="submit">
                Upload File
            </button>
        </form>

        <p id="upload-message" class="status-message" role="status"></p>
    </section>

    <section class="panel">
        <h2>&#128193; My Documents</h2>

        <div id="my-documents-list">
            <p class="empty-message">Loading your documents...</p>
        </div>
    </section>

    <section class="panel">
        <h2>&#128233; Received Files</h2>

        <div id="shared-documents-list">
            <p class="empty-message">Loading shared documents...</p>
        </div>
    </section>

    <p id="documents-message" class="status-message" role="status"></p>


    <section
        id="editor-modal"
        class="editor-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="editor-title"
    >
        <div class="editor-box">
            <h2 id="editor-title">Edit Document</h2>
            <textarea
                id="editor-content"
                spellcheck="false"
                aria-label="Document text"
            ></textarea>
            <p id="editor-message" role="status"></p>
            <div class="editor-actions">
                <button id="editor-save" type="button">Save Changes</button>
                <button id="editor-cancel" type="button">Cancel</button>
            </div>
        </div>
    </section>
</main>

<script>
    const myDocumentsList = document.getElementById("my-documents-list");
    const sharedDocumentsList = document.getElementById("shared-documents-list");
    let currentUserRole = null;

    function showMessage(elementId, message) {
        document.getElementById(elementId).textContent = message;
    }

    async function loadUser() {
        try {
            const response = await fetch("/auth/me", {
                credentials: "same-origin"
            });

            if (!response.ok) {
                window.location.href = "/login";
                return;
            }

            const user = await response.json();

            currentUserRole = user.is_admin || user.role === "admin"
                ? "admin"
                : user.role;

            document.getElementById("welcome-message").textContent =
                "Welcome, " + user.username + "! (" +
                String(currentUserRole || "user").toUpperCase() + ")";

            document.getElementById("upload-panel").hidden =
                currentUserRole === "viewer";

            return true;

        } catch {
            window.location.href = "/login";
            return false;
        }
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024)
            return (bytes / 1024).toFixed(2) + " KB";

        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    function showEmptyMessage(container, message) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = message;
        container.appendChild(empty);
    }


    let editingDocumentId = null;

    async function openDocumentEditor(doc) {
        const modal = document.getElementById("editor-modal");
        const textarea = document.getElementById("editor-content");
        const message = document.getElementById("editor-message");

        editingDocumentId = doc.id;
        textarea.value = "";
        message.textContent = "Loading document...";
        modal.classList.add("open");

        try {
            const response = await fetch(
                `/documents/${doc.id}/edit`,
                { credentials: "same-origin" }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Could not load document");
            }

            textarea.value = data.content;
            message.textContent = "";
            textarea.focus();

        } catch (error) {
            message.textContent = error.message;
        }
    }

    function closeDocumentEditor() {
        document.getElementById("editor-modal").classList.remove("open");
        document.getElementById("editor-message").textContent = "";
        editingDocumentId = null;
    }

    async function saveDocumentEditor() {
        if (editingDocumentId === null) return;

        const saveButton = document.getElementById("editor-save");
        const message = document.getElementById("editor-message");
        const content = document.getElementById("editor-content").value;

        saveButton.disabled = true;
        message.textContent = "Saving...";

        try {
            const response = await fetch(
                `/documents/${editingDocumentId}/edit`,
                {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ content })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Could not save document");
            }

            closeDocumentEditor();
            showMessage("documents-message", "Document saved successfully.");
            await loadDocuments();

        } catch (error) {
            message.textContent = error.message;
        } finally {
            saveButton.disabled = false;
        }
    }

    document.getElementById("editor-save")
        .addEventListener("click", saveDocumentEditor);

    document.getElementById("editor-cancel")
        .addEventListener("click", closeDocumentEditor);

    document.getElementById("editor-modal")
        .addEventListener("click", event => {
            if (event.target.id === "editor-modal") {
                closeDocumentEditor();
            }
        });

    function createDocumentItem(doc, isShared) {
        const item = document.createElement("div");
        item.className = "document-item";

        const extension = doc.filename.split(".").pop().toLowerCase();

        const info = document.createElement("div");
        info.className = "document-info";

        const name = document.createElement("strong");
        name.textContent = doc.filename;

        const details = document.createElement("p");
        details.textContent =
            formatSize(doc.file_size) + " ? Category: " +
            (doc.category || "General");

        info.append(name, details);

        if (isShared) {
            const sharedBy = document.createElement("p");
            sharedBy.textContent =
                "Shared by: " + (doc.shared_by_username || "Unknown");

            const email = document.createElement("p");
            email.textContent =
                "Email: " + (doc.shared_by_email || "Not available");

            const sharedAt = document.createElement("p");

            if (doc.shared_at) {
                const date = new Date(doc.shared_at);
                sharedAt.textContent =
                    "Shared on: " +
                    date.toLocaleString("en-IN", {
                        timeZone: "Asia/Kolkata",
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: true
                    }) + " IST";
            } else {
                sharedAt.textContent = "Shared date unavailable";
            }

            const access = document.createElement("p");
            access.textContent =
                "Access: " + (doc.access_level || "Viewer").toUpperCase();

            info.append(sharedBy, email, sharedAt, access);
        }

        const actions = document.createElement("div");
        actions.className = "document-actions";

        const downloadButton = document.createElement("button");
        downloadButton.className = "action-btn";
        downloadButton.textContent = "Download";

        downloadButton.addEventListener("click", () => {
            downloadDocument(doc.id, doc.filename);
        });

        const previewButton = document.createElement("button");
        previewButton.className = "action-btn";
        previewButton.type = "button";

        if (["pdf", "png", "jpg", "jpeg", "txt", "ppt", "pptx"].includes(extension)) {
            previewButton.textContent = "Preview";
            previewButton.addEventListener("click", () => {
                window.open(`/documents/${doc.id}/preview`, "_blank", "noopener");
            });
        } else {
            previewButton.textContent = "Preview unavailable";
            previewButton.disabled = true;
            previewButton.title = "Download this file to view it.";
        }

        actions.appendChild(previewButton);
        actions.appendChild(downloadButton);

        const canModify =
            currentUserRole !== "viewer" &&
            (!isShared || doc.access_level === "editor");

        if (canModify) {

            if (extension === "txt") {
                const editButton = document.createElement("button");
                editButton.className = "action-btn";
                editButton.type = "button";
                editButton.textContent = "Edit";

                editButton.addEventListener("click", () => {
                    openDocumentEditor(doc);
                });

                actions.appendChild(editButton);
            } else {
                const replaceButton = document.createElement("button");
                replaceButton.className = "action-btn";
                replaceButton.type = "button";
                replaceButton.textContent = "Replace File";

                const fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = `.${extension}`;
                fileInput.hidden = true;

                replaceButton.addEventListener("click", () => {
                    fileInput.click();
                });

                fileInput.addEventListener("change", async () => {
                    const selectedFile = fileInput.files[0];
                    if (!selectedFile) return;

                    const mimeTypes = {
                        pdf: "application/pdf",
                        png: "image/png",
                        jpg: "image/jpeg",
                        jpeg: "image/jpeg",
                        docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                        ppt: "application/vnd.ms-powerpoint",
                        pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
                    };

                    const formData = new FormData();
                    const replacement = new Blob(
                        [selectedFile],
                        { type: mimeTypes[extension] }
                    );

                    formData.append("file", replacement, selectedFile.name);

                    replaceButton.disabled = true;
                    replaceButton.textContent = "Replacing...";

                    try {
                        const response = await fetch(
                            `/documents/${doc.id}/replace`,
                            {
                                method: "PUT",
                                credentials: "same-origin",
                                body: formData
                            }
                        );

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(
                                data.detail || "File replacement failed"
                            );
                        }

                        alert("File replaced successfully!");
                        await loadDocuments();

                    } catch (error) {
                        alert(error.message);
                    } finally {
                        replaceButton.disabled = false;
                        replaceButton.textContent = "Replace File";
                        fileInput.value = "";
                    }
                });

                actions.append(replaceButton, fileInput);
            }
        }



        const canManageDocument =
            currentUserRole === "owner" || currentUserRole === "admin";

        if (!isShared && canManageDocument) {
            const shareButton = document.createElement("button");
            shareButton.className = "action-btn";
            shareButton.type = "button";
            shareButton.textContent = "Share";

            shareButton.addEventListener("click", () => {
                window.location.href = `/share/${doc.id}`;
            });

            actions.appendChild(shareButton);

            const deleteButton = document.createElement("button");
            deleteButton.className = "action-btn";
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", async () => {
                if (!window.confirm(
                    "Are you sure you want to permanently delete this document?"
                )) {
                    return;
                }

                deleteButton.disabled = true;
                deleteButton.textContent = "Deleting...";

                try {
                    const response = await fetch(
                        `/documents/${doc.id}`,
                        {
                            method: "DELETE",
                            credentials: "same-origin"
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.detail || "Document deletion failed"
                        );
                    }

                    showMessage(
                        "documents-message",
                        "Document deleted successfully."
                    );
                    await loadDocuments();

                } catch (error) {
                    showMessage("documents-message", error.message);
                    deleteButton.disabled = false;
                    deleteButton.textContent = "Delete";
                }
            });

            actions.appendChild(deleteButton);
        }

        item.append(info, actions);
        return item;
    }

    async function loadDocuments() {
        myDocumentsList.replaceChildren();
        sharedDocumentsList.replaceChildren();

        try {
            const response = await fetch("/documents/", {
                credentials: "same-origin"
            });

            if (response.status === 401) {
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                throw new Error("Could not load documents");
            }

            const documents = await response.json();

            const myDocuments = documents.filter(doc => doc.is_owner);
            const sharedDocuments = documents.filter(doc => !doc.is_owner);

            document.getElementById("document-count").textContent =
                myDocuments.length;

            document.getElementById("shared-count").textContent =
                sharedDocuments.length;

            myDocuments.forEach(doc => {
                myDocumentsList.appendChild(createDocumentItem(doc, false));
            });

            sharedDocuments.forEach(doc => {
                sharedDocumentsList.appendChild(createDocumentItem(doc, true));
            });

            if (myDocuments.length === 0) {
                showEmptyMessage(myDocumentsList, "No documents uploaded yet.");
            }

            if (sharedDocuments.length === 0) {
                showEmptyMessage(sharedDocumentsList, "No documents shared with you yet.");
            }

        } catch (error) {
            showMessage("documents-message", error.message);
        }
    }

    document.getElementById("upload-form")
        .addEventListener("submit", async event => {

        event.preventDefault();

        const fileInput = document.getElementById("document-file");
        const file = fileInput.files[0];

        if (!file) return;

        if (file.size > 200 * 1024 * 1024) {
            showMessage("upload-message", "Maximum file size is 200 MB.");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append(
            "category",
            document.getElementById("document-category").value
        );

        showMessage("upload-message", "Uploading...");

        try {
            const response = await fetch("/documents/upload", {
                method: "POST",
                credentials: "same-origin",
                body: formData
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "Upload failed");
            }

            showMessage("upload-message", result.message);

            fileInput.value = "";
            document.getElementById("document-category").value = "General";
            await loadDocuments();

        } catch (error) {
            showMessage("upload-message", error.message);
        }
    });

    async function downloadDocument(id, filename) {
        showMessage("documents-message", "Downloading...");

        try {
            const response = await fetch(
                `/documents/${id}/download`,
                { credentials: "same-origin" }
            );

            if (!response.ok) {
                const result = await response.json();
                throw new Error(result.detail || "Download failed");
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = filename;

            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            showMessage("documents-message", "Download successful.");

        } catch (error) {
            showMessage("documents-message", error.message);
        }
    }



    document.getElementById("logout-button")
        .addEventListener("click", async () => {

        try {
            const response = await fetch("/auth/logout", {
                method: "POST",
                credentials: "same-origin"
            });

            if (response.ok) {
                window.location.href = "/login";
            } else {
                showMessage("documents-message", "Logout failed.");
            }

        } catch {
            showMessage("documents-message", "Could not connect to server.");
        }
    });

    loadUser().then(isAuthenticated => {
        if (isAuthenticated) {
            loadDocuments();
        }
    });
</script>

</body>
</html>
