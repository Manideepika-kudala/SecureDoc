<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SecureDoc</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 30px 16px;
            background: #24142F;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 42px;
            background: #F5F0E8;
            border-radius: 16px;
            box-shadow: 0 25px 70px #00000040;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            color: #24142F;
        }

        .login-brand h1 span {
            color: #C8754D;
        }

        .login-brand p {
            margin-top: 10px;
            color: #817780;
            font-size: 13px;
        }

        .login-card label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .login-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid #DED3C9;
            border-radius: 7px;
            background: white;
            font: inherit;
            outline: none;
        }

        .login-card input:focus {
            border-color: #C8754D;
            box-shadow: 0 0 0 3px #C8754D20;
        }

        .login-card button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #C8754D;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-card button:hover {
            background: #B66440;
        }

        .login-card button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            min-height: 20px;
        }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: #817780;
            font-size: 13px;
            line-height: 2;
        }

        .login-footer a {
            color: #C8754D;
            font-weight: 600;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 24px;
            }

            .login-brand h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="login-brand">
            <h1>Secure<span>Doc</span></h1>
            <p>Welcome back to your private vault.</p>
        </div>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="username"
                required
                placeholder="you@example.com"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="128"
                autocomplete="current-password"
                required
                placeholder="Enter your password"
            >

            <button type="submit" id="loginButton">
                Log In to SecureDoc
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <div class="login-footer">
            Don't have an account?
            <a href="/register">Create Account</a>
            <br>
            <a href="/">&#8592; Back to Home</a>
        </div>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        function getCookie(name) {
            const cookies = document.cookie.split(";");

            for (const cookie of cookies) {
                const trimmed = cookie.trim();

                if (trimmed.startsWith(name + "=")) {
                    return decodeURIComponent(
                        trimmed.substring(name.length + 1)
                    );
                }
            }

            return null;
        }

        async function getCsrfToken() {
            let token = getCookie("csrf_token");

            if (token) {
                return token;
            }

            await fetch("/login", {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            token = getCookie("csrf_token");

            if (!token) {
                throw new Error(
                    "Security token unavailable. Please refresh the page."
                );
            }

            return token;
        }

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                const csrfToken = await getCsrfToken();

                const response = await fetch("/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-Token": csrfToken
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error("Invalid email or password.");
                    }

                    if (response.status === 403) {
                        throw new Error(
                            "Security validation failed. Please refresh the page."
                        );
                    }

                    if (response.status === 429) {
                        throw new Error(
                            "Too many attempts. Please try again later."
                        );
                    }

                    if (response.status >= 500) {
                        throw new Error(
                            "Server error. Please try again later."
                        );
                    }

                    throw new Error(
                        result.detail || "Login failed."
                    );
                }

                message.textContent = "Login successful. Redirecting...";

                window.location.assign("/dashboard");

            } catch (error) {
                message.textContent =
                    error.message || "Unable to connect. Please try again.";

                loginButton.disabled = false;
                loginButton.textContent = "Log In to SecureDoc";
            }
        });
    </script>

</body>
</html>
