<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SecureDoc</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 30px 16px;
            background: #24142F;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            background: #F5F0E8;
            border-radius: 16px;
            box-shadow: 0 25px 70px #00000040;
        }

        .register-brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            color: #24142F;
        }

        .register-brand h1 span {
            color: #C8754D;
        }

        .register-brand p {
            margin-top: 10px;
            color: #817780;
            font-size: 13px;
        }

        .register-card label {
            display: block;
            margin: 18px 0 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .register-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid #DED3C9;
            border-radius: 7px;
            background: white;
            font: inherit;
            outline: none;
        }

        .register-card input:focus {
            border-color: #C8754D;
            box-shadow: 0 0 0 3px #C8754D20;
        }

        .register-card button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 7px;
            background: #C8754D;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .register-card button:hover {
            background: #B66440;
        }

        #message {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .back-home {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #817780;
            font-size: 13px;
        }

        .back-home:hover {
            color: #C8754D;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>
<body>

    <main class="register-card">
        <div class="register-brand">
            <h1>Secure<span>Doc</span></h1>
            <p>Create your private document vault.</p>
        </div>

        <form id="registerForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   minlength="3" maxlength="80" required
                   placeholder="Choose a username">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   required placeholder="you@example.com">

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" maxlength="128" required
                   placeholder="At least 8 characters">

            <button type="submit" id="registerButton">
                Create My Account
            </button>

            <p id="message" role="status"></p>
        </form>

        <a href="/" class="back-home">← Back to Home</a>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Creating account...";

            const userData = {
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                if (!response.ok) {
                    const detail = result.detail;
                    message.style.color = "#B33A3A";
                    message.textContent = typeof detail === "string"
                        ? detail
                        : "Please check your information and try again.";
                    return;
                }

                message.style.color = "#477044";
                message.textContent = "Account created successfully! Your SecureDoc account is ready.";
                form.reset();

            } catch (error) {
                message.style.color = "#B33A3A";
                message.textContent = "Unable to connect. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Create My Account";
            }
        });
    </script>

</body>
</html>
